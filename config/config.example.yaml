# Конфигурация сервера Signage.
# На сервере: /etc/signage/config.yaml (его пишет deploy/install.sh). При разработке: config/config.yaml.

server:
  port: 8080
  publicUrl: "http://10.33.44.20:8080"   # адрес, по которому плееры видят сервер
  timezone: "Europe/Moscow"              # время расписания считается в этом поясе
  sessionSecret: "change-me-to-a-long-random-string"   # минимум 16 символов: openssl rand -hex 32
  sessionTtlHours: 12
  allowedNetworks: ["10.0.0.0/8", "192.168.0.0/16", "172.16.0.0/12"]  # остальным 403
  trustProxy: false                      # true, если перед сервером reverse proxy

users:
  # Хэш пароля: на сервере — signage hash-password, при разработке — npm run hash-password
  - login: admin
    role: admin
    passwordHash: "$2b$10$REPLACE_ME_REPLACE_ME_REPLACE_ME_REPLACE_ME_REPLACE_M"
  - login: operator
    role: operator
    passwordHash: "$2b$10$REPLACE_ME_REPLACE_ME_REPLACE_ME_REPLACE_ME_REPLACE_M"

storage:
  mediaPath: /srv/signage-smb/share   # сетевой диск SMB (монтирует deploy/setup-smb.sh)
  dbPath: /var/lib/signage/db/signage.sqlite # ЛОКАЛЬНЫЙ диск, не SMB
  backupPath: /srv/signage-smb/share/_backup # куда класть ежедневный бэкап БД
  # Диск VM. Приоритет у SMB; если он недоступен, сервер работает отсюда:
  #  - новые загрузки сохраняются сюда и потом сами переносятся на SMB;
  #  - при localMirror: true здесь же лежит копия всей медиатеки, и плееры
  #    получают файлы, даже если SMB недоступен (в т.ч. при загрузке VM).
  # null — отключить (тогда без SMB загрузка блокируется, файлы не отдаются).
  localFallbackPath: /var/lib/signage/local-media
  localMirror: true
  localMinFreeMb: 2048            # не писать на диск VM, если свободно меньше
  backupTime: "03:30"             # время ежедневного бэкапа (server.timezone)
  backupKeep: 14                  # сколько копий хранить
  maxUploadMb: 500
  maxUnzippedMb: 1000             # лимит HTML-пакета после распаковки

proxy:
  allowlist:                      # домены, которые HTML-контент может запрашивать через сервер
    - "api.open-meteo.com"
    - "www.cbr-xml-daily.ru"
  cacheTtlSec: 300

player:
  heartbeatSec: 15
  offlineAfterSec: 45
  defaultImageDurationSec: 10
  defaultHtmlDurationSec: 30
