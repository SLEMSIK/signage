services:
  signage:
    build: .
    image: signage:latest
    container_name: signage
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - ./config/config.yaml:/config/config.yaml:ro
      # Сетевой диск монтируется на хосте (deploy/setup-smb.sh), а сюда пробрасывается
      # родительский каталог. rslave: если SMB подмонтируется позже (был недоступен при
      # загрузке VM), контейнер увидит его без перезапуска. Контейнер стартует и без SMB.
      - type: bind
        source: ${SMB_ROOT:-/srv/signage-smb}
        target: /data/smb
        bind:
          propagation: rslave
          create_host_path: true
      - local_media:/data/local-media
      - db:/data/db
    environment:
      CONFIG_PATH: /config/config.yaml
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  # Диск VM: файлы, загруженные при недоступном SMB, и копия (зеркало) медиатеки
  # для работы без SMB.
  local_media: {}
  # База SQLite — только локально: на SMB ломаются блокировки.
  db: {}
